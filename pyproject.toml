[project]
name = "orgmind"
version = "0.1.0"
description = "A Company Brain that remembers, reasons over relationships and shows its work, with FalkorDB as the context layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OrgMind contributors" }]

dependencies = [
    "falkordb>=1.0",
    "anthropic>=0.40",
    "fastapi>=0.110,<0.116",
    # FastAPI 0.115 needs starlette <0.42. Installing `mcp` pulls a much
    # newer starlette by default, which breaks FastAPI's Router (it
    # passes on_startup, removed in starlette 1.x). Pin it explicitly.
    "starlette>=0.40,<0.42",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # MCP: 2.x renamed FastMCP -> MCPServer; mcp_server/server.py
    # supports both, so either major version works.
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "agents*", "data*", "graph*", "ingestion*", "memory*", "mcp_server*", "scripts*", "tools*"]
exclude = ["web*", "docs*", "tests*"]