services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: orgmind_falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    container_name: orgmind_falkordb_browser
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orgmind_api
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    env_file: .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orgmind_mcp
    depends_on:
      falkordb:
        condition: service_healthy
    env_file: .env
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - MCP_TRANSPORT=stdio
    volumes:
      - .:/app
    # MCP over stdio: attach a client with
    #   docker compose run --rm mcp
    # or run it over HTTP with MCP_TRANSPORT=streamable-http and the
    # ports mapping below.
    # ports:
    #   - "8001:8000"
    command: python -m mcp_server.server

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: orgmind_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/chat
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  falkordb_data: